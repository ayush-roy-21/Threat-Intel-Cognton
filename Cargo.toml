[package]
name = "india_threat_feed"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.9"
ed25519-dalek = "2.0"
sha2 = "0.10"
ipnet = "2.9"
rand = "0.8"
bincode = "1.3"
ahash = "0.8"
chrono = "0.4"
csv = "1.3"
zip = "0.6"
clap = { version = "4.4", features = ["derive"] }
uuid = { version = "1.6", features = ["v4"] }
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
